[cursor]
vi_mode_style = "None"
style = { blinking = "On", shape = "Beam" }

[font]
size = 11.0
normal = { family = "monospace" }

[scrolling]
history = 5000

[selection]
save_to_clipboard = true

[window]
dynamic_padding = false
dynamic_title = true
dimensions = { columns = 150, lines = 35 }
padding = { x = 4, y = 4 }
